name: churn-imbalanced-dataset

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important pour DVC

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CML utility
        uses: iterative/setup-cml@v2

      - name: Install dependencies (Python, DVC, CML)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[gdrive]==3.63.0"

      - name: Configure DVC remote for Google Drive (OAuth user creds)
        run: |
          # Recréer les credentials OAuth depuis le secret
          echo '${{ secrets.GDRIVE_CREDENTIALS_JSON }}' > gdrive-creds.json
          
          # Configurer DVC remote localement
          dvc remote modify --local new_gdrive gdrive_user_credentials_file gdrive-creds.json
          dvc remote modify --local new_gdrive gdrive_client_id "${{ secrets.GDRIVE_CLIENT_ID }}"
          dvc remote modify --local new_gdrive gdrive_client_secret "${{ secrets.GDRIVE_CLIENT_SECRET }}"
          
          # Diagnostics
          dvc remote list
          cat .dvc/config.local

      - name: Pull data & models from DVC remote (Drive)
        run: |
          dvc pull -v

      - name: Train / Evaluate model(s)
        run: |
          python script.py

      - name: Track new artifacts with DVC
        run: |
          # Ajouter les changements aux fichiers trackés par DVC
          dvc add models/
          dvc add data/
          
          # Configurer Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Committer les fichiers .dvc mis à jour
          git add data.dvc models.dvc .gitignore
          git diff --cached --quiet || git commit -m "Update DVC artifacts [skip ci]"

      - name: Push data & models to DVC remote (Drive)
        run: |
          dvc push -v

      - name: Push Git changes
        if: github.event_name == 'push'
        run: |
          git push origin main

      - name: Generate and publish CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Metrics" > report.md
          cat metrics.txt >> report.md
          echo "" >> report.md
          echo "## Confusion Matrix" >> report.md
          echo "![Confusion Matrix](./conf_matrix.png)" >> report.md
          cml comment create report.md